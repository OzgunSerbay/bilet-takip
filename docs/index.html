<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilet Takip</title>
<meta name="description" content="Hannover çevresinden İstanbul ve Adana'ya valizli uçak bileti fiyat takibi">
<meta name="theme-color" content="#0f6fff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f3f5f9; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --accent: #0f6fff; --accent-soft: #e6efff; --good: #0a8a4a; --good-soft: #e3f6ec;
    --warn: #a16207; --warn-soft: #fef3c7; --chip: #f1f3f7; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
    --c-ist: #0f6fff; --c-ada: #e8590c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220; --card: #131c2e; --text: #e8edf5; --muted: #93a0b5; --line: #22304a;
      --accent: #5b9dff; --accent-soft: #17284a; --good: #4ad08a; --good-soft: #12301f;
      --warn: #f2c14e; --warn-soft: #3a2f10; --chip: #1b2740; --shadow: none;
      --c-ist: #5b9dff; --c-ada: #ff8a3d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(32px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; padding: calc(8px + env(safe-area-inset-top)) 0 12px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  button, .btn { font: inherit; border: 0; cursor: pointer; border-radius: 12px; }
  .icon-btn { background: var(--card); color: var(--text); width: 40px; height: 40px; display: grid; place-items: center;
    box-shadow: var(--shadow); font-size: 18px; }
  .icon-btn.spin span { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card { background: var(--card); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .banner { border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; background: var(--warn-soft); color: var(--warn); }
  .hero .label { color: var(--muted); font-size: 13px; }
  .hero .price { font-size: 44px; font-weight: 750; letter-spacing: -.02em; line-height: 1.1; margin: 4px 0 2px; }
  .hero .price small { font-size: 18px; font-weight: 600; color: var(--muted); }
  .route { font-size: 17px; font-weight: 650; }
  .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; white-space: nowrap; }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .btn-primary { display: block; text-align: center; background: var(--accent); color: #fff; padding: 12px; margin-top: 14px;
    text-decoration: none; font-weight: 650; border-radius: 12px; }
  .tabs { display: flex; background: var(--card); border-radius: 14px; padding: 4px; gap: 4px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .tabs button { flex: 1; padding: 9px 6px; background: transparent; color: var(--muted); font-weight: 600; border-radius: 10px; }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .day { background: var(--chip); border-radius: 12px; padding: 8px 2px; text-align: center; color: var(--text); }
  .day .d { font-size: 12px; color: var(--muted); }
  .day .p { font-weight: 700; font-size: 15px; margin-top: 2px; }
  .day.main { outline: 2px solid var(--accent); outline-offset: -2px; }
  .day.best .p { color: var(--good); }
  .day.on { background: var(--accent); }
  .day.on .d, .day.on .p { color: #fff; }
  .day .none { color: var(--muted); font-weight: 500; font-size: 13px; }
  .legend { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  svg.chart { width: 100%; height: auto; display: block; }
  .flight { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 12px 0; border-top: 1px solid var(--line);
    color: inherit; text-decoration: none; }
  .flight:first-of-type { border-top: 0; }
  .flight .r { font-weight: 650; }
  .flight .m { color: var(--muted); font-size: 13px; }
  .flight .pr { text-align: right; font-weight: 750; font-size: 18px; }
  .flight .pr small { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); }
  .empty { color: var(--muted); padding: 8px 0; }
  .more { width: 100%; padding: 10px; background: var(--chip); color: var(--text); margin-top: 6px; font-weight: 600; }
  .note { color: var(--muted); font-size: 12.5px; }
  .note p { margin: 6px 0; }
  .topic { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .topic code { flex: 1; background: var(--chip); padding: 9px 10px; border-radius: 10px; font-size: 13px; overflow-x: auto; white-space: nowrap; }
  .topic button { background: var(--accent-soft); color: var(--accent); padding: 9px 12px; font-weight: 600; }
  .push { display: flex; align-items: center; gap: 12px; }
  .push > div { flex: 1; }
  .push.on { background: var(--good-soft); }
  .push.on b { color: var(--good); }
  .btn-primary.small { margin: 0; padding: 10px 14px; white-space: nowrap; font-size: 14px; }
  .btn-primary[disabled] { opacity: .6; }
  .ghost { background: transparent; color: var(--muted); padding: 8px 10px; border: 1px solid var(--line); font-size: 13px; }
  .skeleton { color: var(--muted); text-align: center; padding: 60px 0; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>✈️ Bilet Takip</h1>
      <div class="sub" id="updated">Yükleniyor…</div>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Yenile"><span>↻</span></button>
  </header>
  <div id="app"><div class="skeleton">Fiyatlar yükleniyor…</div></div>
</main>

<script>
const AYLAR = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const GUNLER = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const RENK = { "İstanbul": "var(--c-ist)", "Adana": "var(--c-ada)" };
const state = { data: null, city: "Tümü", day: null, showAll: false };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function tarih(t, uzun) {
  const d = new Date(t + "T12:00:00");
  return `${d.getDate()} ${AYLAR[d.getMonth()]}${uzun ? " " + GUNLER[d.getDay()] : ""}`;
}
function once(iso) {
  const dk = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (dk < 1) return "az önce";
  if (dk < 60) return `${dk} dk önce`;
  const sa = Math.floor(dk / 60);
  if (sa < 24) return `${sa} sa ${dk % 60 ? (dk % 60) + " dk " : ""}önce`;
  return `${Math.floor(sa / 24)} gün önce`;
}
const havalimani = { IST: "İstanbul Havalimanı", SAW: "Sabiha Gökçen", COV: "Çukurova", ADA: "Şakirpaşa" };

function flights() {
  let list = state.data.ucuslar;
  if (state.city !== "Tümü") list = list.filter(f => f.varis_sehir === state.city);
  if (state.day) list = list.filter(f => f.tarih === state.day);
  return list;
}

function render() {
  const d = state.data;
  if (!d) return;
  $("#updated").textContent = `Son kontrol: ${once(d.guncelleme)} · ${d.taranan} direkt uçuş`;
  const yasli = (Date.now() - new Date(d.guncelleme).getTime()) > 3 * 3600 * 1000;

  const sira = ["İstanbul", "Adana"];
  const rank = (c) => { const i = sira.indexOf(c); return i < 0 ? 99 : i; };
  const cities = ["Tümü", ...Object.keys(d.sehirler).sort((a, b) => rank(a) - rank(b) || a.localeCompare(b, "tr"))];
  const best = state.city === "Tümü" ? d.en_ucuz : d.sehirler[state.city];

  // Günlük en ucuz (seçili şehre göre)
  const gunFiyat = {};
  for (const t of d.tarihler) {
    const g = d.gunler[t] || {};
    const adaylar = state.city === "Tümü" ? Object.values(g) : (g[state.city] ? [g[state.city]] : []);
    gunFiyat[t] = adaylar.length ? Math.min(...adaylar.map(f => f.valizli)) : null;
  }
  const varOlan = Object.values(gunFiyat).filter(x => x != null);
  const enIyiGun = varOlan.length ? Math.min(...varOlan) : null;

  const list = flights();
  const gosterilen = state.showAll ? list : list.slice(0, 8);

  $("#app").innerHTML = `
    ${yasli ? `<div class="banner">⚠️ Son kontrol ${once(d.guncelleme)} yapıldı. GitHub'daki otomatik kontrol gecikmiş olabilir.</div>` : ""}

    <div class="tabs" role="tablist">
      ${cities.map(c => `<button class="${c === state.city ? "on" : ""}" data-city="${esc(c)}">${esc(c)}</button>`).join("")}
    </div>

    ${best ? `
    <section class="card hero">
      <div class="label">En ucuz${state.city !== "Tümü" ? " · " + esc(state.city) : ""} · 20 kg valiz dahil</div>
      <div class="price">${best.valizli} <small>€</small></div>
      <div class="route">${esc(best.nereden_sehir)} → ${esc(best.varis_sehir)} <span class="meta">(${esc(havalimani[best.nereye] || best.nereye)})</span></div>
      <div class="meta">${tarih(best.tarih, true)} · ${best.kalkis}–${best.varis} · ${esc(best.havayolu)} ${esc(best.ucus_no)}</div>
      <div class="chips">
        <span class="chip">🚆 Hannover'dan ${esc(best.tren)}</span>
        ${best.kesin ? `<span class="chip good">✓ Kesin fiyat · ${esc(best.paket)}</span>` : `<span class="chip warn">≈ Valiz ücreti tahmini</span>`}
        <span class="chip">Valizsiz ${best.fiyat} €</span>
      </div>
      <a class="btn-primary" href="${esc(best.link)}" target="_blank" rel="noopener">Bileti gör</a>
    </section>` : `<section class="card empty">Bu seçim için uçuş bulunamadı.</section>`}

    ${pushKart()}

    <section class="card">
      <h2>Günlere göre en ucuz</h2>
      <div class="days">
        ${d.tarihler.map(t => {
          const p = gunFiyat[t];
          const cls = ["day", t === d.asil_tarih ? "main" : "", p != null && p === enIyiGun ? "best" : "", state.day === t ? "on" : ""].join(" ");
          return `<button class="${cls}" data-day="${t}"><div class="d">${tarih(t, false)}<br>${GUNLER[new Date(t + "T12:00:00").getDay()]}</div>
            <div class="p">${p != null ? p + "€" : `<span class="none">yok</span>`}</div></button>`;
        }).join("")}
      </div>
      <div class="legend"><span>Çerçeveli: asıl tarih (${tarih(d.asil_tarih)})</span><span>Dokun: o günü filtrele</span></div>
    </section>

    ${chart(d)}

    <section class="card">
      <h2>Uçuşlar ${state.day ? "· " + tarih(state.day, true) : ""} <span class="sub">(valizli fiyata göre)</span></h2>
      ${gosterilen.length ? gosterilen.map(f => `
        <a class="flight" href="${esc(f.link)}" target="_blank" rel="noopener">
          <div>
            <div class="r">${esc(f.nereden_sehir)} → ${esc(f.varis_sehir)} <span class="m">${esc(f.nereye)}</span></div>
            <div class="m">${tarih(f.tarih, true)} · ${f.kalkis}–${f.varis} · ${esc(f.havayolu)}</div>
            <div class="m">🚆 ${esc(f.tren)} · ${f.kesin ? "kesin fiyat" : "valiz tahmini"}</div>
          </div>
          <div class="pr">${f.valizli} €<small>valizsiz ${f.fiyat} €</small></div>
        </a>`).join("") : `<div class="empty">Bu seçim için uçuş yok.</div>`}
      ${list.length > 8 ? `<button class="more" id="more">${state.showAll ? "Daha az göster" : `Tümünü göster (${list.length})`}</button>` : ""}
    </section>

    <section class="card note">
      <h2>ℹ️ Bilgi</h2>
      <p>İstersen bildirimleri <b>ntfy</b> uygulamasıyla da alabilirsin; ntfy'da şu konuya abone ol:</p>
      <div class="topic"><code id="topic">${esc(d.ntfy)}</code><button id="copy">Kopyala</button></div>
      <p style="margin-top:12px">Fiyatlar Google Uçuşlar'dan, 1 yetişkin, tek yön, sadece direkt uçuşlar. Tren bileti fiyata dahil değil; tren süreleri yaklaşık. "Kesin" fiyatlar havayolunun valizli paketinden gelir; diğerlerinde bilete tahmini valiz ücreti eklenmiştir.</p>
    </section>
  `;

  document.querySelectorAll("[data-city]").forEach(b => b.onclick = () => { state.city = b.dataset.city; state.showAll = false; render(); });
  document.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { state.day = state.day === b.dataset.day ? null : b.dataset.day; state.showAll = false; render(); });
  const more = $("#more"); if (more) more.onclick = () => { state.showAll = !state.showAll; render(); };
  const pac = $("#push-ac"); if (pac) pac.onclick = bildirimAc;
  const pkap = $("#push-kapat"); if (pkap) pkap.onclick = bildirimKapat;
  const copy = $("#copy");
  if (copy) copy.onclick = async () => {
    try { await navigator.clipboard.writeText(d.ntfy); copy.textContent = "Kopyalandı ✓"; }
    catch { copy.textContent = "Kopyalanamadı"; }
    setTimeout(() => { copy.textContent = "Kopyala"; }, 2000);
  };
}

function chart(d) {
  const pts = d.gecmis.filter(g => g.s && Object.keys(g.s).length);
  if (pts.length < 2) return `<section class="card"><h2>Fiyat geçmişi</h2><div class="empty">Grafik birkaç kontrol sonra görünecek (${pts.length} kayıt var).</div></section>`;
  const sehirler = state.city === "Tümü" ? Object.keys(RENK).filter(c => pts.some(p => p.s[c] != null)) : [state.city];
  const W = 360, H = 150, P = { l: 30, r: 6, t: 10, b: 20 };
  const vals = pts.flatMap(p => sehirler.map(c => p.s[c]).filter(v => v != null));
  if (!vals.length) return "";
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 10) { lo -= 5; hi += 5; }
  const t0 = new Date(pts[0].t).getTime(), t1 = new Date(pts[pts.length - 1].t).getTime();
  const x = t => P.l + (W - P.l - P.r) * ((new Date(t).getTime() - t0) / Math.max(1, t1 - t0));
  const y = v => P.t + (H - P.t - P.b) * (1 - (v - lo) / (hi - lo));
  const lines = sehirler.map(c => {
    const seg = pts.filter(p => p.s[c] != null).map(p => `${x(p.t).toFixed(1)},${y(p.s[c]).toFixed(1)}`).join(" ");
    return `<polyline fill="none" stroke="${RENK[c] || "var(--accent)"}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${seg}"/>`;
  }).join("");
  const grid = [lo, (lo + hi) / 2, hi].map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>
    <text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}</text>`).join("");
  const fmt = t => { const z = new Date(t); return `${z.getDate()} ${AYLAR[z.getMonth()]} ${String(z.getHours()).padStart(2, "0")}:${String(z.getMinutes()).padStart(2, "0")}`; };
  return `<section class="card"><h2>Fiyat geçmişi <span class="sub">(valizli en ucuz)</span></h2>
    <svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${lines}
      <text x="${P.l}" y="${H - 4}" font-size="11" fill="var(--muted)">${fmt(pts[0].t)}</text>
      <text x="${W - P.r}" y="${H - 4}" font-size="11" fill="var(--muted)" text-anchor="end">${fmt(pts[pts.length - 1].t)}</text></svg>
    <div class="legend">${sehirler.map(c => `<span><span class="dot" style="background:${RENK[c] || "var(--accent)"}"></span>${esc(c)}</span>`).join("")}</div>
  </section>`;
}

// ---------- Bildirimler (web push) ----------
const VAPID_PUBLIC = "BMxrnsaKJ_Ufv9_INfDfbbQfnnSnkTrCWROiRPuTYORx77O4SIH3fWgj6rH0sSMOc3TYnSeTyLFwC5zgwAASg34";
const KAYIT_KONU = "bilet-takip-kayit-190dd53c21394ec6";
state.push = "bilinmiyor"; // yok | kapali | acik | engelli | bekliyor | hata
state.pushHata = "";

function pushDestek() {
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}
async function pushDurum() {
  if (!pushDestek()) { state.push = "yok"; return; }
  if (Notification.permission === "denied") { state.push = "engelli"; return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    state.push = sub ? "acik" : "kapali";
  } catch { state.push = "kapali"; }
}
function b64ToBytes(s) {
  const pad = "=".repeat((4 - s.length % 4) % 4);
  const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
async function kayitGonder(islem, sub) {
  const r = await fetch(`https://ntfy.sh/${KAYIT_KONU}`, {
    method: "POST",
    body: JSON.stringify({ islem, abonelik: sub.toJSON() }),
  });
  if (!r.ok) throw new Error("kayıt " + r.status);
}
async function bildirimAc() {
  state.push = "bekliyor"; render();
  try {
    const izin = await Notification.requestPermission();
    if (izin !== "granted") { state.push = izin === "denied" ? "engelli" : "kapali"; render(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
    await kayitGonder("ekle", sub);
    reg.showNotification("🔔 Bildirim izni verildi", {
      body: "Kayıt tamam. Fiyat bildirimleri bir sonraki saat başı kontrolden itibaren gelecek.",
      icon: "icon-192.png", badge: "icon-192.png", tag: "bilet-takip-izin",
    });
    state.push = "acik";
  } catch (e) {
    state.push = "hata"; state.pushHata = String(e && e.message || e);
  }
  render();
}
async function bildirimKapat() {
  state.push = "bekliyor"; render();
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) { try { await kayitGonder("sil", sub); } catch {} await sub.unsubscribe(); }
    state.push = "kapali";
  } catch (e) { state.push = "hata"; state.pushHata = String(e && e.message || e); }
  render();
}
function pushKart() {
  const s = state.push;
  if (s === "bilinmiyor") return "";
  if (s === "acik") return `<section class="card push on"><div><b>🔔 Bildirimler açık</b>
      <div class="sub">Fiyat düşünce ve her saat başı bu telefona bildirim gelir.</div></div>
      <button class="ghost" id="push-kapat">Kapat</button></section>`;
  if (s === "yok") return `<section class="card push"><div><b>🔕 Bu tarayıcı bildirim desteklemiyor</b>
      <div class="sub">Android'de Chrome ile açıp uygulamayı ana ekrana yüklersen bildirim açabilirsin.</div></div></section>`;
  if (s === "engelli") return `<section class="card push"><div><b>🔕 Bildirim izni kapalı</b>
      <div class="sub">Telefon Ayarları → Uygulamalar → Chrome (veya Bilet Takip) → Bildirimler kısmından izin ver, sonra bu sayfayı yenile.</div></div></section>`;
  const hata = s === "hata" ? `<div class="sub" style="color:var(--warn)">Olmadı: ${esc(state.pushHata)}. İnternetini kontrol edip tekrar dene.</div>` : "";
  return `<section class="card push"><div><b>🔔 Fiyat düşünce haber alalım mı?</b>
      <div class="sub">Başka uygulama gerekmez, bildirim doğrudan buraya gelir.</div>${hata}</div>
      <button class="btn-primary small" id="push-ac" ${s === "bekliyor" ? "disabled" : ""}>${s === "bekliyor" ? "Açılıyor…" : "Bildirimleri aç"}</button></section>`;
}

async function load() {
  const btn = $("#refresh");
  btn.classList.add("spin");
  try {
    const r = await fetch(`veri.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    state.data = await r.json();
    render();
  } catch (e) {
    if (!state.data) $("#app").innerHTML = `<div class="card empty">Veri yüklenemedi. İnternet bağlantını kontrol edip ↻ tuşuna bas.</div>`;
  } finally {
    btn.classList.remove("spin");
  }
}

$("#refresh").onclick = load;
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => state.data && render(), 60000);
load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
pushDurum().then(() => state.data && render());
</script>
</body>
</html>
