name: Fiyat takibi

on:
  # Asıl saatlik düzen: her çalıştırmanın sonundaki "zincir" işi bir sonraki saat başını bekleyip
  # bu iş akışını kendisi yeniden başlatır. GitHub'ın kendi zamanlayıcısı güvenilmez (günde 3-4 kez
  # çalışıyor); sadece zincir koparsa yeniden başlatmak için yedek olarak duruyor.
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:         # Uygulamadaki ↻ tuşu ya da GitHub'da "Run workflow" (her zaman çalışır)
    inputs:
      otomatik:
        description: "Zincirin başlattığı saatlik kontrol (yakın zamanda kontrol yapıldıysa atlar)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: fiyat-takibi
      cancel-in-progress: false
    env:
      TZ: Europe/Istanbul
      NTFY_KONU: ${{ secrets.NTFY_KONU }}
      VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # kuyrukta bekleyen çalıştırma da en güncel veriyle başlasın

      - name: Kontrol zamanı geldi mi?
        id: zaman
        env:
          OLAY: ${{ github.event_name }}
          OTOMATIK: ${{ inputs.otomatik }}
        run: |
          python3 - <<'EOF'
          import json, os, datetime as dt
          atla = False
          if os.environ["OLAY"] == "schedule" or os.environ.get("OTOMATIK") == "true":
              try:
                  son = dt.datetime.fromisoformat(json.load(open("docs/veri.json", encoding="utf-8"))["guncelleme"])
                  gecen = (dt.datetime.now(dt.timezone.utc) - son).total_seconds() / 60
                  print(f"Son başarılı kontrol {gecen:.0f} dk önce")
                  atla = gecen < 30
              except Exception as e:
                  print("Son kontrol zamanı okunamadı:", e)
          print("Atlanıyor" if atla else "Kontrol yapılacak")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"atla={'true' if atla else 'false'}\n")
          EOF

      - uses: actions/setup-python@v5
        if: steps.zaman.outputs.atla != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneleri kur
        if: steps.zaman.outputs.atla != 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Son taramayı geri yükle
        if: steps.zaman.outputs.atla != 'true'
        uses: actions/cache/restore@v4
        with:
          path: son_tarama.json
          key: son-tarama-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: son-tarama-

      - name: Fiyatları kontrol et
        if: steps.zaman.outputs.atla != 'true'
        run: python ucak_takip.py

      - name: Son taramayı sakla
        if: always() && steps.zaman.outputs.atla != 'true' && hashFiles('son_tarama.json') != ''
        uses: actions/cache/save@v4
        with:
          path: son_tarama.json
          key: son-tarama-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Sonuçları kaydet
        if: always() && steps.zaman.outputs.atla != 'true'
        run: |
          git config user.name "fiyat-takip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/veri.json fiyat_gecmisi.json
          for f in valiz_onbellek.json abonelikler.enc; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Fiyat güncellemesi $(date '+%Y-%m-%d %H:%M')"
            # Arada başka bir kontrol kayıt yaptıysa: çakışmada bu kontrolün (daha yeni) sonucu geçerli
            git pull --rebase -X theirs --autostash || { git rebase --abort; git pull --no-rebase -X ours --no-edit; }
            git push
          fi

  zincir:
    # Bir sonraki saat başına kadar bekler, sonra yeni kontrolü başlatır.
    # Yeni bir çalıştırma (↻ tuşu vb.) gelince eski bekleyen iptal olur; zincirde hep tek halka kalır.
    needs: kontrol
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
    concurrency:
      group: zincir
      cancel-in-progress: true
    steps:
      - name: Saat başını bekle ve sonraki kontrolü başlat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Europe/Istanbul date +%Y%m%d)" -gt 20261223 ]; then
            echo "Uçuş tarihleri geçti, zincir durduruldu."
            exit 0
          fi
          simdi=$(date +%s)
          hedef=$(( (simdi / 3600 + 1) * 3600 ))
          echo "Sonraki kontrol: $(TZ=Europe/Istanbul date -d @$hedef '+%H:%M') ($(( (hedef - simdi) / 60 )) dk sonra)"
          sleep $(( hedef - simdi ))
          gh workflow run takip.yml --repo "$GITHUB_REPOSITORY" --ref main -f otomatik=true
